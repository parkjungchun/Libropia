<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>제1열람실 좌석 현황</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  body { font-family: 'Apple SD Gothic Neo', sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color:#222; }
  h1 { font-size: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 14px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: center; }
  th { background: #f4f4f4; }
  .updated { color: #888; font-size: 13px; margin-top: 4px; }
</style>
</head>
<body>
  <h1>제1열람실 이용가능 좌석수 (오늘)</h1>
  <p class="updated">마지막 갱신: 2026-11-02 13:30:32</p>
  <canvas id="chart" height="220"></canvas>
  <table>
    <tr><th>시간</th><th>전체</th><th>이용중</th><th>이용가능</th></tr>
    <tr><td>13:00</td><td>59</td><td>52</td><td>4</td></tr><tr><td>13:15</td><td>59</td><td>54</td><td>2</td></tr><tr><td>13:30</td><td>59</td><td>55</td><td>1</td></tr>
  </table>
  <script>
    new Chart(document.getElementById('chart'), {
      type: 'line',
      data: {
        labels: ['13:00', '13:15', '13:30'],
        datasets: [{
          label: '이용가능 좌석수',
          data: ['4', '2', '1'],
          borderColor: '#2b8a3e',
          backgroundColor: 'rgba(43,138,62,0.15)',
          fill: true,
          tension: 0.2
        }]
      },
      options: { scales: { y: { beginAtZero: true } } }
    });
  </script>
</body>
</html>
