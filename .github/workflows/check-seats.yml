name: 좌석 현황 체크

on:
  # 스케줄은 cron-job.org(외부)가 workflow_dispatch를 호출해서 담당함.
  # 깃허브 자체 schedule은 중복 실행을 막기 위해 비활성화.
  workflow_dispatch: {}   # 수동 실행 / 외부 cron-job.org가 이걸 호출함

permissions:
  contents: write

concurrency:
  group: seat-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 좌석 확인 + 텔레그램 알림
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python seat_scraper.py

      - name: 기록 커밋
        run: |
          git config user.name "seat-bot"
          git config user.email "seat-bot@users.noreply.github.com"
          git add seat_log.csv dashboard.html state.json
          git diff --staged --quiet || git commit -m "seat log update"

          success=false
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              success=true
              break
            fi
            echo "push 재시도 ($i)..."
            sleep 5
          done

          if [ "$success" != "true" ]; then
            echo "push 최종 실패"
            exit 1
          fi
